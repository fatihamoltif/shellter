# PostgreSQL (partie P2, séance K2) — StatefulSet + PVC : la donnée survit à la
# suppression du pod (storageClass local-path fournie par k3s).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: shellter
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: shellter
            - name: POSTGRES_DB
              value: shellter
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shellter-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "shellter", "-d", "shellter"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              memory: "512Mi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi

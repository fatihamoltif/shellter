# Réconciliation (partie P4, séance K4) — aligne la base sur l'état du cluster.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: shellter-reconciler
  namespace: shellter
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      template:
        spec:
          serviceAccountName: shellter-api
          restartPolicy: Never
          containers:
            - name: reconciler
              image: ghcr.io/fatihamoltif/shellter-flask:latest
              command: ["python", "scripts/k8s_reconciler.py"]
              envFrom:
                - configMapRef:
                    name: shellter-config
              env:
                - name: PYTHONPATH        # scripts/k8s_reconciler.py fait `from app import ...`
                  value: "/app"
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: shellter-secrets
                      key: POSTGRES_PASSWORD
                - name: DATABASE_URL
                  value: "postgresql://shellter:$(POSTGRES_PASSWORD)@postgres:5432/shellter"
                - name: INSTANCE_ENCRYPTION_KEY
                  valueFrom:
                    secretKeyRef:
                      name: shellter-secrets
                      key: INSTANCE_ENCRYPTION_KEY

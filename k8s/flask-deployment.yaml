# Flask (partie P3, séance K2) — control plane applicatif.
# Tourne sous le ServiceAccount shellter-api (droits K8s pour piloter les locations).
# L'image est taguée par SHA de commit par la CI (séance K5) ; :latest en dev.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask
  namespace: shellter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      labels:
        app: flask
    spec:
      serviceAccountName: shellter-api
      containers:
        - name: flask
          image: ghcr.io/fatihamoltif/shellter-flask:latest
          command: ["python", "docker/start.py"]   # attend la DB, migre, seed, lance gunicorn
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: shellter-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shellter-secrets
                  key: POSTGRES_PASSWORD
            # $(POSTGRES_PASSWORD) est interpolé par Kubernetes (env dépendant).
            - name: DATABASE_URL
              value: "postgresql://shellter:$(POSTGRES_PASSWORD)@postgres:5432/shellter"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: shellter-secrets
                  key: SECRET_KEY
            - name: INSTANCE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: shellter-secrets
                  key: INSTANCE_ENCRYPTION_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              memory: "512Mi"

# Démo LOCALE de la branche main avec HTTPS *et* location réelle.
#   - db    : PostgreSQL
#   - agent : Worker Agent réel (crée de vrais conteneurs SSH sur le Docker de l'hôte)
#   - web   : Flask (worker seedé pointant sur l'agent, SSH via localhost)
#   - nginx : reverse proxy HTTPS (TLS auto-signé dans nginx/tls/)
#
# Accès : https://localhost        (cadenas "non sécurisé" = certificat auto-signé, normal)
#         http://localhost:8080    (debug HTTP direct, sans nginx)
# Comptes : admin / admin123  ·  demo / password123
# Lancer :  docker compose -f docker-compose.demo-https.yml up --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shellter
      POSTGRES_PASSWORD: shellter
      POSTGRES_DB: shellter
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shellter -d shellter"]
      interval: 5s
      timeout: 5s
      retries: 10

  agent:
    build:
      context: .
      dockerfile: docker/agent/Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock      # crée des conteneurs sur l'hôte

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python docker/start.py
    environment:
      FLASK_CONFIG: development
      SECRET_KEY: dev-real
      DATABASE_URL: postgresql://shellter:shellter@db:5432/shellter
      SEED_MOCK_WORKER: "1"
      WORKER_IP: "localhost"            # -> ssh ...@localhost -p <port>
      AGENT_URL: "http://agent:5000"
      AGENT_TIMEOUT: "180"              # 1re location d'une distro = build de l'image SSH
      HEARTBEAT_TIMEOUT_SECONDS: "86400"
    depends_on:
      db:
        condition: service_healthy
      agent:
        condition: service_started
    ports:
      - "8080:5000"                     # debug HTTP direct (facultatif)

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/tls:/etc/nginx/tls:ro
    ports:
      - "80:80"                         # redirige vers 443
      - "443:443"                       # HTTPS
    depends_on:
      - web

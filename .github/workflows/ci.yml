name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (ruff, ansible-lint, hadolint)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dépendances de lint
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
     
      - name: Installer les collections Ansible
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Ruff (lint Python)
        run: ruff check .

      - name: ansible-lint (playbooks et rôles)
        run: ansible-lint ansible/

      - name: Installer hadolint
        run: |
          sudo wget -O /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint

      - name: hadolint (lint Dockerfiles)
        run: |
          for f in $(find . -name "Dockerfile"); do
            echo "== $f =="
            hadolint --failure-threshold error "$f"
          done

  test:
    name: Tests (pytest + PostgreSQL)
    runs-on: ubuntu-latest
    needs: lint

    # Service PostgreSQL éphémère pour les tests (FK + CHECK réelles)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shellter
          POSTGRES_PASSWORD: shellter
          POSTGRES_DB: shellter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shellter -d shellter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      # 127.0.0.1 (pas "localhost") : sur le runner, localhost peut resoudre en IPv6 (::1)
      # ou le service Postgres n'ecoute pas -> echec de connexion.
      DATABASE_URL: postgresql://shellter:shellter@127.0.0.1:5432/shellter_test

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lancer les tests
        run: pytest -v         

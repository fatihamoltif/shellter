name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (pytest + PostgreSQL)
    runs-on: ubuntu-latest

    # Service PostgreSQL éphémère pour les tests (FK + CHECK réelles)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shellter
          POSTGRES_PASSWORD: shellter
          POSTGRES_DB: shellter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shellter -d shellter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      # 127.0.0.1 (pas "localhost") : sur le runner, localhost peut resoudre en IPv6 (::1)
      # ou le service Postgres n'ecoute pas -> echec de connexion.
      DATABASE_URL: postgresql://shellter:shellter@127.0.0.1:5432/shellter_test

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lancer les tests
        run: pytest -v

  integration:
    name: Tests d'intégration (docker compose)
    runs-on: ubuntu-latest
    needs: test          # ne tourne que si les tests unitaires passent
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Démarrer la stack (Flask + PostgreSQL + agent mock)
        run: docker compose -f docker-compose.ci.yml up -d --build

      - name: Attendre que /health réponde
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/health; then echo "stack prête"; exit 0; fi
            sleep 3
          done
          echo "timeout en attendant /health"; exit 1

      - name: Installer les dépendances de test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lancer les tests d'intégration
        run: pytest integration_tests/ -v

      - name: Collecter les logs en cas d'échec
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs > compose-logs.txt

      - name: Publier les logs en artefact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt

      - name: Arrêter la stack
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (pytest + PostgreSQL)
    runs-on: ubuntu-latest

    env:
      AGENT_TOKEN: ${{ secrets.AGENT_TOKEN_TEST }}
      DATABASE_URL: postgresql://shellter:shellter@127.0.0.1:5432/shellter_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shellter
          POSTGRES_PASSWORD: shellter
          POSTGRES_DB: shellter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shellter -d shellter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Vérifier la présence du token agent
        shell: bash
        run: |
          if [ -z "$AGENT_TOKEN" ]; then
            echo "AGENT_TOKEN absent"
            exit 1
          fi

          echo "AGENT_TOKEN injecté correctement"

      - name: Lancer les tests
        run: python -m pytest -v

  integration:
    name: Tests d'intégration (docker compose)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Démarrer la stack (Flask + PostgreSQL + agent mock)
        run: docker compose -f docker-compose.ci.yml up -d --build

      - name: Attendre que /health réponde
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/health; then
              echo "stack prête"
              exit 0
            fi

            sleep 3
          done

          echo "timeout en attendant /health"
          exit 1

      - name: Installer les dépendances de test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lancer les tests d'intégration
        run: pytest integration_tests/ -v

      - name: Collecter les logs en cas d'échec
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs > compose-logs.txt

      - name: Publier les logs en artefact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt

      - name: Arrêter la stack
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  # --------------------------------------------------
  # Sécurité : scans indépendants
  # --------------------------------------------------

  sast:
    name: Sécurité — SAST (Semgrep)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Semgrep (injection SQL, XSS, mauvais patterns)
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

          semgrep scan \
            --error \
            --severity=ERROR \
            --config=.semgrep \
            --config=p/python \
            --config=p/flask \
            app scripts wsgi.py docker

  secrets:
    name: Sécurité — Secrets (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Gitleaks (secrets commités)
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:latest \
            detect \
            --source=/repo \
            --no-git \
            --redact \
            -v

  image-scan:
    name: Sécurité — Image (Trivy)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build de l'image Flask
        run: docker build -t shellter-web:ci -f docker/Dockerfile .

      - name: Trivy (gate CVE CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: shellter-web:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table


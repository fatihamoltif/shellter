name: Build and Test Docker Images

on:
  push:
    branches: [ "main", "yousseframmeh", "imenmezrigui" ]
    tags: [ "v*.*.*" ]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/shellter

jobs:
  build-and-test:
    name: Build & Smoke Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: flask
            dockerfile: docker/Dockerfile
            context: .
            test_cmd: |
              docker run --rm shellter/flask:test python -c "from app import create_app; create_app('testing')"
          - image: agent
            dockerfile: docker/agent/Dockerfile
            context: .
            test_cmd: |
              docker run --rm shellter/agent:test python -c "import docker"
          - image: ubuntu
            dockerfile: docker/distros/ubuntu24/Dockerfile
            context: docker/distros/ubuntu24
            test_cmd: |
              docker run -d -p 2222:22 --name test-ubuntu shellter/ubuntu:test
              sleep 2
              nc -z localhost 2222
          - image: debian
            dockerfile: docker/distros/debian13/Dockerfile
            context: docker/distros/debian13
            test_cmd: |
              docker run -d -p 2222:22 --name test-debian shellter/debian:test
              sleep 2
              nc -z localhost 2222
          - image: alpine
            dockerfile: docker/distros/alpine/Dockerfile
            context: docker/distros/alpine
            test_cmd: |
              docker run -d -p 2222:22 --name test-alpine shellter/alpine:test
              sleep 2
              nc -z localhost 2222

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Connexion à GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Génération des tags dynamiques
        id: tags
        run: |
          SHA_TAG=${GITHUB_SHA::7}
          echo "tag_sha=$SHA_TAG" >> $GITHUB_OUTPUT
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "tag_git=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build de l'image
        run: |
          docker build -t shellter/${{ matrix.image }}:test -f ${{ matrix.dockerfile }} ${{ matrix.context }}
          docker tag shellter/${{ matrix.image }}:test shellter/${{ matrix.image }}:${{ steps.tags.outputs.tag_sha }}
          if [ -n "${{ steps.tags.outputs.tag_git }}" ]; then
            docker tag shellter/${{ matrix.image }}:test shellter/${{ matrix.image }}:${{ steps.tags.outputs.tag_git }}
          fi

      - name: Smoke test
        run: |
          ${{ matrix.test_cmd }}

      - name: Tag de l'image pour le registre
        run: |
          docker tag shellter/${{ matrix.image }}:test ${{ env.IMAGE_BASE }}-${{ matrix.image }}:${{ steps.tags.outputs.tag_sha }}
          docker tag shellter/${{ matrix.image }}:test ${{ env.IMAGE_BASE }}-${{ matrix.image }}:latest
          if [ -n "${{ steps.tags.outputs.tag_git }}" ]; then
            docker tag shellter/${{ matrix.image }}:test ${{ env.IMAGE_BASE }}-${{ matrix.image }}:${{ steps.tags.outputs.tag_git }}
          fi

      - name: Push de l'image sur ghcr.io
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ env.IMAGE_BASE }}-${{ matrix.image }}:${{ steps.tags.outputs.tag_sha }}
          docker push ${{ env.IMAGE_BASE }}-${{ matrix.image }}:latest
          if [ -n "${{ steps.tags.outputs.tag_git }}" ]; then
            docker push ${{ env.IMAGE_BASE }}-${{ matrix.image }}:${{ steps.tags.outputs.tag_git }}
          fi

      - name: Génération du SBOM (Syft) et publication en artefact
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_BASE }}-${{ matrix.image }}:${{ steps.tags.outputs.tag_sha }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.image }}-${{ steps.tags.outputs.tag_sha }}.json
          artifact-name: sbom-${{ matrix.image }}-${{ steps.tags.outputs.tag_sha }}.json

server {
    listen 80;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/shellter.crt;
    ssl_certificate_key /etc/nginx/tls/shellter.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://web:5000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Le 1er rent d'une distro sur un worker "froid" construit son image SSH
        # (plusieurs dizaines de secondes) : le timeout doit dépasser AGENT_TIMEOUT.
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
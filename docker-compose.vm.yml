# Control plane déployé SUR la VM controller (db + web).
# Les Worker Agents tournent, eux, sur les VM workers (voir ansible/deploy.yml).
# Accès : http://192.168.56.10:8080

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shellter
      POSTGRES_PASSWORD: shellter
      POSTGRES_DB: shellter
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shellter -d shellter"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: python docker/start.py
    environment:
      FLASK_CONFIG: development
      SECRET_KEY: prod-demo
      DATABASE_URL: postgresql://shellter:shellter@db:5432/shellter
      REAL_WORKERS: "worker1:192.168.56.11,worker2:192.168.56.12,worker3:192.168.56.13"
      AGENT_TIMEOUT: "180"
      HEARTBEAT_TIMEOUT_SECONDS: "86400"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:5000"

volumes:
  db_data:

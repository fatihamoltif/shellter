# Control plane déployé SUR la VM controller (db + web + nginx HTTPS + workers de fond).
# Les Worker Agents tournent, eux, sur les VM workers (voir ansible/deploy.yml).
# Accès : https://192.168.56.10  (nginx/TLS)  — HTTP direct de debug : http://192.168.56.10:8080

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shellter
      POSTGRES_PASSWORD: shellter
      POSTGRES_DB: shellter
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shellter -d shellter"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: python docker/start.py
    environment:
      FLASK_CONFIG: development
      SECRET_KEY: prod-demo
      DATABASE_URL: postgresql://shellter:shellter@db:5432/shellter
      # Plus de REAL_WORKERS : les workers s'enregistrent via /workers/heartbeat.
      AGENT_TIMEOUT: "180"
      HEARTBEAT_TIMEOUT_SECONDS: "60"   # heartbeat reel -> detection de panne en 60s
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:5000"

  # Worker de fond (Fatiha) : detruit les conteneurs des locations expirees.
  expiration-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: python scripts/expiration_worker.py
    environment:
      PYTHONPATH: /app
      FLASK_CONFIG: development
      SECRET_KEY: prod-demo
      DATABASE_URL: postgresql://shellter:shellter@db:5432/shellter
      AGENT_TIMEOUT: "180"
      EXPIRATION_CHECK_INTERVAL: "15"
    depends_on:
      db:
        condition: service_healthy

  # Worker de fond : detection de panne (heartbeat) + reprise des instances.
  recovery-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: python scripts/recovery_worker.py
    environment:
      PYTHONPATH: /app
      FLASK_CONFIG: development
      SECRET_KEY: prod-demo
      DATABASE_URL: postgresql://shellter:shellter@db:5432/shellter
      AGENT_TIMEOUT: "180"
      HEARTBEAT_TIMEOUT_SECONDS: "60"   # doit correspondre a celui du web
      RECOVERY_CHECK_INTERVAL: "15"
    depends_on:
      db:
        condition: service_healthy

  # Reverse proxy HTTPS (TLS auto-signe genere par Ansible dans nginx/tls/).
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/tls:/etc/nginx/tls:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web

volumes:
  db_data:

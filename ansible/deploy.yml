---
# deploy.yml — Déploiement de Shellter sur les VM (S10, intégration réelle).
#   - all        : résolution DNS fiable et durable (pré-requis des pulls d'images)
#   - workers    : Worker Agent réel (conteneur Docker, socket monté) + ports ouverts (ufw)
#   - controller : control plane (db + web + nginx HTTPS) + ports ouverts
#
# Lancement :  cd ansible && ansible-playbook -i hosts.ini deploy.yml --ask-vault-pass

- name: Résolution DNS fiable et durable (évite l'échec de pull d'images)
  hosts: all
  become: true
  tasks:
    # Après une suspension/reprise de VM, le DNS NAT par défaut peut se figer et
    # systemd-resolved ne résout plus (ex. docker.io) -> les builds échouent.
    # On fixe des serveurs DNS upstream fiables, de façon persistante (reboot inclus).
    - name: Créer le dossier de drop-in systemd-resolved
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        mode: "0755"

    - name: Définir des serveurs DNS upstream fiables
      ansible.builtin.copy:
        dest: /etc/systemd/resolved.conf.d/shellter-dns.conf
        mode: "0644"
        content: |
          [Resolve]
          DNS=8.8.8.8 1.1.1.1
          FallbackDNS=8.8.4.4 1.0.0.1
      register: resolved_conf

    - name: S'assurer que /etc/resolv.conf pointe sur le stub systemd-resolved
      ansible.builtin.file:
        src: /run/systemd/resolve/stub-resolv.conf
        dest: /etc/resolv.conf
        state: link
        force: true
      register: resolv_link

    - name: Redémarrer systemd-resolved si la configuration a changé
      ansible.builtin.systemd:
        name: systemd-resolved
        state: restarted
      when: resolved_conf.changed or resolv_link.changed

    - name: Vérifier la résolution DNS externe
      ansible.builtin.command: getent hosts registry-1.docker.io
      changed_when: false
      register: dns_check
      retries: 3
      delay: 2
      until: dns_check.rc == 0


- name: Déployer les Worker Agents sur les workers
  hosts: workers
  become: true
  tasks:
    - name: Ouvrir le port de l'agent (ufw)
      community.general.ufw:
        rule: allow
        port: "5000"
        proto: tcp

    - name: Ouvrir la plage de ports SSH des conteneurs loués (ufw)
      community.general.ufw:
        rule: allow
        port: "20000:30000"
        proto: tcp

    - name: (Re)déployer le Worker Agent (conteneur sur le Docker local)
      ansible.builtin.shell: |
        set -e
        docker rm -f shellter-agent 2>/dev/null || true
        docker build -q -t shellter-agent -f /vagrant/docker/agent/Dockerfile /vagrant
        docker run -d --name shellter-agent --restart unless-stopped \
          -p 5000:5000 -v /var/run/docker.sock:/var/run/docker.sock \
          -e CONTROLLER_URL="http://192.168.56.10:8080" \
          -e WORKER_HOSTNAME="{{ inventory_hostname }}" \
          -e WORKER_IP="{{ ansible_host }}" \
          -e AGENT_URL="http://{{ ansible_host }}:5000" \
          -e HEARTBEAT_INTERVAL="10" \
          shellter-agent
      args:
        executable: /bin/bash

    - name: Vérifier que l'agent répond
      ansible.builtin.uri:
        url: "http://127.0.0.1:5000/containers"
        status_code: 200
      retries: 10
      delay: 3
      register: agent_check
      until: agent_check.status == 200


- name: Déployer le control plane sur le controller
  hosts: controller
  become: true
  tasks:
    - name: Ouvrir les ports web + HTTPS (ufw)
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "8080"
        - "80"
        - "443"

    - name: Créer le dossier des certificats TLS
      ansible.builtin.file:
        path: /vagrant/nginx/tls
        state: directory
        mode: "0755"

    - name: Générer un certificat TLS auto-signé pour nginx (si absent)
      ansible.builtin.command:
        cmd: >
          openssl req -x509 -nodes -newkey rsa:2048 -days 365
          -keyout /vagrant/nginx/tls/shellter.key
          -out /vagrant/nginx/tls/shellter.crt
          -subj "/CN=192.168.56.10"
        creates: /vagrant/nginx/tls/shellter.crt

    - name: Démarrer db + web + workers de fond + nginx (docker compose)
      ansible.builtin.command:
        cmd: docker compose -f /vagrant/docker-compose.vm.yml up -d --build
        chdir: /vagrant

    - name: Vérifier que /health répond (HTTP direct)
      ansible.builtin.uri:
        url: "http://127.0.0.1:8080/health"
        status_code: 200
      retries: 20
      delay: 3
      register: health_check
      until: health_check.status == 200

    - name: Vérifier que nginx sert bien en HTTPS
      ansible.builtin.uri:
        url: "https://127.0.0.1/health"
        validate_certs: false
        status_code: 200
      retries: 10
      delay: 3
      register: https_check
      until: https_check.status == 200
